name: daza-atendimento

services:
  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8100:8000"
    networks:
      erp:
        aliases:
          - daza-atendimento-api
      proxy: {}

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - api
    networks:
      - proxy

networks:
  erp:
    name: daza-erp_erp_net
    external: true
  proxy:
    name: homelab_proxy
    external: true
