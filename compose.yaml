name: daza-atendimento

services:
  api:
    build: ./apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      # A senha é carregada somente do ambiente local no momento do deploy.
      # Ela não fica no repositório nem é exposta ao navegador.
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-cache:6379/0
    ports:
      - "127.0.0.1:8100:8000"
    networks:
      erp:
        aliases:
          - daza-atendimento-api
      proxy: {}

  waha:
    # Versão fixada: evita mudanças não revisadas em um conector de WhatsApp.
    image: devlikeapro/waha:latest-2026.9.2
    restart: unless-stopped
    environment:
      WAHA_API_KEY: ${WAHA_API_KEY}
      WAHA_DASHBOARD_ENABLED: "false"
      WHATSAPP_SWAGGER_ENABLED: "false"
      WAHA_PRINT_QR: "false"
      WHATSAPP_RESTART_ALL_SESSIONS: "true"
      WHATSAPP_HOOK_URL: http://daza-atendimento-api:8000/v1/webhooks/waha/whatsapp
      WHATSAPP_HOOK_EVENTS: message
      WHATSAPP_HOOK_CUSTOM_HEADERS: X-DAZA-WAHA-Webhook:${WAHA_WEBHOOK_SECRET}
    volumes:
      - waha_sessions:/app/.sessions
    networks:
      - erp

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3100:3000"
    depends_on:
      - api
    networks:
      - proxy

networks:
  erp:
    name: daza-erp_erp_net
    external: true
  proxy:
    name: homelab_proxy
    external: true

volumes:
  waha_sessions:
